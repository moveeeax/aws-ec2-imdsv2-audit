[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-ec2-imdsv2-audit"
version = "0.2.0"
description = "Audit EC2 instances, launch templates and launch configurations for reachable IMDSv1"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Tarassov", email = "michael@tarassov.me" }]
keywords = ["aws", "ec2", "imdsv2", "security", "audit", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = ["boto3>=1.28"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.17"]

[project.scripts]
aws-ec2-imdsv2-audit = "aws_ec2_imdsv2_audit.cli:main"

[project.urls]
Homepage = "https://github.com/moveeeax/aws-ec2-imdsv2-audit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
